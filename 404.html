<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost in the Void</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Playfair Display', serif; 
            background-color: #111827; 
            color: #d1d5db; 
            overflow: hidden;
        }
        
        .glitch-wrapper {
            position: relative;
        }
        
        .glitch {
            font-family: 'Source Code Pro', monospace;
            font-size: 8rem;
            font-weight: 700;
            position: relative;
            color: #d1d5db;
            animation: glitch-skew 1s infinite linear alternate-reverse;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 #ff00c1;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 #00fff9, 2px 2px #ff00c1;
            clip: rect(85px, 450px, 90px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        @keyframes glitch-skew {
            0% { transform: skew(0deg); }
            5% { transform: skew(-1deg); }
            10% { transform: skew(1deg); }
            15% { transform: skew(-2deg); }
            20% { transform: skew(2deg); }
            25% { transform: skew(0deg); }
            100% { transform: skew(0deg); }
        }

        @keyframes glitch-anim {
            0% { clip: rect(42px, 9999px, 44px, 0); }
            5% { clip: rect(12px, 9999px, 60px, 0); }
            10% { clip: rect(40px, 9999px, 40px, 0); }
            15% { clip: rect(60px, 9999px, 80px, 0); }
            20% { clip: rect(20px, 9999px, 50px, 0); }
            25% { clip: rect(30px, 9999px, 90px, 0); }
            30% { clip: rect(50px, 9999px, 20px, 0); }
            35% { clip: rect(70px, 9999px, 100px, 0); }
            40% { clip: rect(33px, 9999px, 55px, 0); }
            45% { clip: rect(80px, 9999px, 110px, 0); }
            50% { clip: rect(45px, 9999px, 65px, 0); }
            55% { clip: rect(90px, 9999px, 120px, 0); }
            60% { clip: rect(10px, 9999px, 30px, 0); }
            65% { clip: rect(100px, 9999px, 130px, 0); }
            70% { clip: rect(25px, 9999px, 75px, 0); }
            75% { clip: rect(110px, 9999px, 140px, 0); }
            80% { clip: rect(60px, 9999px, 80px, 0); }
            85% { clip: rect(130px, 9999px, 150px, 0); }
            90% { clip: rect(70px, 9999px, 90px, 0); }
            95% { clip: rect(140px, 9999px, 160px, 0); }
            100% { clip: rect(80px, 9999px, 100px, 0); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(90px, 9999px, 100px, 0); }
            5% { clip: rect(120px, 9999px, 140px, 0); }
            10% { clip: rect(70px, 9999px, 80px, 0); }
            15% { clip: rect(150px, 9999px, 160px, 0); }
            20% { clip: rect(80px, 9999px, 90px, 0); }
            25% { clip: rect(110px, 9999px, 130px, 0); }
            30% { clip: rect(100px, 9999px, 120px, 0); }
            35% { clip: rect(140px, 9999px, 150px, 0); }
            40% { clip: rect(90px, 9999px, 110px, 0); }
            45% { clip: rect(130px, 9999px, 140px, 0); }
            50% { clip: rect(100px, 9999px, 110px, 0); }
            55% { clip: rect(120px, 9999px, 130px, 0); }
            60% { clip: rect(140px, 9999px, 150px, 0); }
            65% { clip: rect(110px, 9999px, 120px, 0); }
            70% { clip: rect(130px, 9999px, 140px, 0); }
            75% { clip: rect(100px, 9999px, 110px, 0); }
            80% { clip: rect(120px, 9999px, 130px, 0); }
            85% { clip: rect(140px, 9999px, 150px, 0); }
            90% { clip: rect(100px, 9999px, 110px, 0); }
            95% { clip: rect(120px, 9999px, 130px, 0); }
            100% { clip: rect(140px, 9999px, 150px, 0); }
        }
    </style>
</head>
<body class="bg-gray-900 flex flex-col items-center justify-center min-h-screen p-4">
    <div class="glitch-wrapper">
        <div class="glitch" data-text="404">404</div>
    </div>
    <h1 class="text-3xl md:text-4xl font-bold text-center text-purple-300 mt-4">Are you lost, or just exploring the void?</h1>
    <p class="mt-4 text-lg text-purple-400 text-center">Either way, you've stumbled upon a dead end. Let's get you back.</p>
    <a href="ravinandan2005.github.io" class="inline-block mt-8 px-8 py-3 bg-purple-600 text-white font-semibold rounded-lg shadow-lg hover:bg-purple-700 transition transform hover:scale-105">
        Return to Home Base
    </a>
</body>
</html>
