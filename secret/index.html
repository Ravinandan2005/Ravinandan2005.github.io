<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Secret Chamber</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Playfair+Display:wght@400;700&family=Permanent+Marker&family=Fuzzy+Bubbles:wght@400;700&family=Source+Code+Pro:wght@400;700&family=Caveat:wght@700&family=Sacramento&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/secretstyle.css">
    <link rel="icon" type="image/png" href="assets/logo.png" />
</head>
<body>
    <div id="theme-container" class="relative w-screen h-screen entry-background">
        <div id="entry-screen" class="absolute inset-0 flex flex-col items-center justify-center p-4 z-30 opacity-0">
            <h1 class="text-4xl md:text-5xl font-bold text-center font-serif text-purple-300">You've found the secret chamber.</h1>
            <p class="mt-4 text-lg text-purple-400 text-center">This space only opens to those who know their code.</p>
            
            <div class="relative w-full max-w-xs mt-8 group">
                <input type="password" id="passcode-input" class="w-full p-3 text-center bg-gray-900/50 border border-purple-800 rounded-lg text-gray-200 placeholder-gray-500 focus:outline-none focus:border-transparent transition-colors" style="font-family: 'Source Code Pro', monospace;" placeholder="Enter the secret code">
                <span class="absolute top-0 left-0 block h-0.5 w-0 bg-purple-400 transition-all duration-200 group-focus-within:w-full"></span>
                <span class="absolute top-0 right-0 block w-0.5 h-0 bg-purple-400 transition-all duration-200 delay-200 group-focus-within:h-full"></span>
                <span class="absolute bottom-0 right-0 block h-0.5 w-full bg-purple-400 transition-all duration-200 delay-400 origin-right group-focus-within:w-0"></span>
                <span class="absolute bottom-0 left-0 block w-0.5 h-full bg-purple-400 transition-all duration-200 delay-[600ms] origin-bottom group-focus-within:h-0"></span>
            </div>

            <div id="error-message" class="mt-4 text-center text-red-400 opacity-0 transition-opacity duration-300">
                <p>Uh oh… I think I might’ve missed someone.</p>
                <p>Mail me your deets — who knows, you might make it here 💫.</p>
                <a href="mailto:ravinandanjn2005@gmail.com?subject=I think I should be on your secret list 😏" class="inline-block mt-4 px-6 py-2 bg-purple-600 text-white font-semibold rounded-lg shadow-md hover:bg-purple-700 transition">
                    <span class="mr-2">✉️</span> Mail me
                </a>
            </div>
        </div>

        <div id="door-container" class="absolute inset-0 flex pointer-events-none z-20">
            <div class="door door-left w-1/2 h-full bg-[#111827]"></div>
            <div class="door door-right w-1/2 h-full bg-[#111827]"></div>
        </div>
        
        <div id="message-screen" class="absolute inset-0 flex flex-col items-center justify-center p-8 opacity-0 pointer-events-none z-10">
            <div class="glass-box">
                <div id="message-content" class="special-message text-center">
                    </div>
            </div>
             <button id="go-back-btn" class="mt-8 px-6 py-2 bg-white/20 backdrop-blur-sm rounded-lg hover:bg-white/30 transition text-white font-semibold">Go Back</button>
             <div id="redirect-notice" class="mt-4 text-center text-sm opacity-0 transition-opacity duration-500"></div>
        </div>
    </div>

    <script src="src/secretscript.js"></script>
</body>
</html>
